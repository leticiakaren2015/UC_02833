<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        tabela {
            border-collapse: collapse;
        }
        td{
            border: solid 3px;
        }
        th{
            border: solid 3px;
        }
        
    

    </style>
</head>
<body>
    <h1>Criação de Tabela</h1>

    <table width="380" style="border: solid 2px;">
        <tr > <!--Primeira linha-->
            <td style="height: 37px; align-items: center; vertical-align: middle;">Venda/Mês</td>
            <th style="align-items: left; vertical-align:bottom ">Janeiro</th>
            <th style="align-items: left; vertical-align:bottom">Fevereiro</th>
            <th style="align-items: left; vertical-align:bottom">Março</th>
        </tr>

        <tr><!--Segunda linha-->
            <td style="height: 36px; align-items: right; vertical-align: top;">Computadores</td>
            <th style="vertical-align:middle; background-color:aquamarine">10</th>
            <th style="vertical-align:middle; background-color:aquamarine">15</th>
            <th style="vertical-align:middle; background-color:aquamarine">15</th>
        </tr>

        <tr><!--Terceira linha-->
            <td style="height: 36px; align-items: right; vertical-align: top;">Monitores</td>
            <th style="vertical-align:middle;background-color:blueviolet">9</th>
            <th style="vertical-align:middle; background-color:blueviolet">12</th>
            <th style="vertical-align:middle; background-color:blueviolet">14</th>
        </tr>
    </table>

    <h2>Exemplo de mais uma tabela</h2>
    <table width="380" style="border: solid 2px; background-color:lightsalmon">
        <tr> <!--Primeira linha-->
            <td style="height: 37px; align-items: center; vertical-align: middle;">Venda/Mês</td>
            <th style="align-items: left; vertical-align:bottom ">Janeiro</th>
            <th style="align-items: left; vertical-align:bottom">Fevereiro</th>
            <th style="align-items: left; vertical-align:bottom">Março</th>
        </tr>

        <tr><!--Segunda linha-->
            <td style="height: 36px; align-items: right; vertical-align: top;">Computadores</td>
            <th style="vertical-align:middle; background-color:aquamarine">10</th>
            <th style="vertical-align:middle; background-color:aquamarine">15</th>
            <th style="vertical-align:middle; background-color:aquamarine">15</th>
        </tr>

        <tr><!--Terceira linha-->
            <td style="height: 36px; align-items: right; vertical-align: top;">Monitores</td>
            <th style="vertical-align:middle; background-color:blueviolet">9</th>
            <th style="vertical-align:middle; background-color:blueviolet">12</th>
            <th style="vertical-align:middle; background-color:blueviolet">14</th>
        </tr>
    </table>
</body>
</html>
