<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turismo em Portugal</title>
    <link rel="stylesheet" href="estilo.css" type="text/css">
    
</head>
<body>
    <!-- Links de Navegação -->
    <nav>
        <a href="index.html">Inicio</a>
        <a href="norte.html" target="_self">Norte</a>
        <a href="centro.html" target="_self">Centro</a>
        <a href="sul.html" target="_self">Sul</a>
    </nav>
    <!-- Cabeçalho do Site -->
    <header>
        <h1>Região Sul / Turismo em Portugal</h1>
    </header>


    <!-- Área de Conteúdo Principal -->
    <main>
        <article>
            <h2>Deixe os seus comentário</h2>
            <section>
            <form class="form"  action="leticiakaren2015@gmail.com" method="post" enctype="text/plain">
                <label for="nome">Nome:
                    <input type="text" id="nome" name="nome" size="60" required maxlength="100" placeholder="Coloque o nome">
                </label> <br><br>

                <label for="email">Email:
                    <input type="email" name="email" size="40" required maxlength="40" placeholder="nome@dominio.pt">
                </label><br><br>

                <label for="data_nas">Data Nascimento:
                    <input type="date" name="data_nas"> <br><br>
                </label> <br><br>

                <label for="avalicao">Avaliação: <br>
                    <input type="radio" name="avaliacao" value="1"> 1 estrela <br>
                    <input type="radio" name="avaliacao" value="2"> 2 estrela <br>
                    <input type="radio" name="avaliacao" value="3"> 3 estrela <br>
                    <input type="radio" name="avaliacao" value="4"> 4 estrela <br>
                    <input type="radio" name="avaliacao" value="5"> 5 estrela <br>
                </label> <br><br>

                <label for="msg">Mensagem: <br>
                    <textarea name="msg" cols="60"  rows="8"></textarea>
                </label> <br><br>

                <input type="submit"value="Enviar">
                <input type="reset"value="Cancelar">

            </section>
        </article>

    </main>
    <aside>
        
    </aside>

    <!-- Rodapé da Página -->
    <footer>

    </footer>

</body>
</html>
