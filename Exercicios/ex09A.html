<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: solid 2px;
            width: 400px;
            height: 100px;
            text-align: center;
        }
        td{
            border: solid 1px;
        }
    </style>
</head>
<body>
    <h1>Exercício 9A</h1>
    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>

        <tr>
            <td>a</td>
            <td>b</td>
            <td>c</td>
        </tr>
    </table>
    <h2>Exercício 9B</h2>
        <table>
        <tr>
            <td rowspan="2">1 e 4</td>
            <td>2</td>
            <td>3</td>
        </tr>

        <tr>
            <td>5</td>
            <td>6</td>
        </tr>
    </table>
    <h2>Exercício 9C</h2>
            <table>
        <tr>
            <td colspan="2">1 e 2</td>
            <td rowspan="2">3 e 6</td>
        </tr>

        <tr>
            <td>4</td>
            <td>5</td>
        </tr>
    </table>
</body>
</html>
